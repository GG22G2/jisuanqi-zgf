[package]
name = "rust-calculator"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "24.0.0"
tokio = { version = "1.43", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.21", features = ["derive"] }
pollster = "0.4"
open = "5"
indexmap = { version = "2.7", features = ["serde"] }
rayon = "1.10"
